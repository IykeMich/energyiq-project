name: Frontend Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION:                  us-east-1
  S3_BUCKET:                   energyiq-dev-frontend-779599553697
  CLOUDFRONT_DISTRIBUTION_ID:  EJKB2D2SG0BJJ

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build supplier
        working-directory: apps/supplier
        run: yarn tsc -b && yarn vite build --base /supplier/

      - name: Build distributor
        working-directory: apps/distributor
        run: yarn tsc -b && yarn vite build --base /distributor/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy supplier to S3
        run: |
          aws s3 sync apps/supplier/dist/ s3://${{ env.S3_BUCKET }}/supplier/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/supplier/dist/index.html s3://${{ env.S3_BUCKET }}/supplier/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deploy distributor to S3
        run: |
          aws s3 sync apps/distributor/dist/ s3://${{ env.S3_BUCKET }}/distributor/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/distributor/dist/index.html s3://${{ env.S3_BUCKET }}/distributor/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/supplier/*" "/distributor/*"